[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora, construído com Google ADK"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # Faz o Python honrar o trust store do sistema operacional. Necessário em
    # redes com inspeção TLS (proxy corporativo com CA própria), inofensivo
    # em qualquer outro ambiente.
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Caminho alternativo de desenvolvimento: apontar os agentes para um gateway
# compatível com a API da OpenAI, em vez do Google AI Studio. NÃO é o caminho
# exigido pelo enunciado — o padrão continua sendo Gemini com chave do AI Studio.
# Instale com `uv sync --extra gateway`.
[project.optional-dependencies]
gateway = [
    "litellm>=1.84",
    # O litellm importa `mcp` em runtime, mas não o declara como dependência.
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]
